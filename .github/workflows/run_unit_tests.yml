name: Run Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Unique per (workflow, job) so this job never races another workflow's
          # job over the same content-based setup-uv cache key.
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright Chromium Browser
        run: uv run playwright install chromium

      - name: Run Tests with Pytest
        run: uv run pytest --cov=src/oddsharvester --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  integration:
    name: Run Integration Tests (HAR replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Unique per (workflow, job) so this job never races another workflow's
          # job over the same content-based setup-uv cache key.
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright Chromium Browser
        run: uv run playwright install chromium

      - name: Run HAR replay tests
        run: uv run pytest tests/integration/ -q -m integration
