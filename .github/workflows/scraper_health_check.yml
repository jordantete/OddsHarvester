name: Scraper Health Check

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays at 11:00 UTC
  workflow_dispatch:

jobs:
  test_scraper:
    name: Run Scraper Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Unique per (workflow, job) so this job never races another workflow's
          # job over the same content-based setup-uv cache key.
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright Chromium Browser
        run: uv run playwright install chromium

      - name: Run the live_only tests against OddsPortal
        run: uv run pytest tests/integration -m live_only --live -q
