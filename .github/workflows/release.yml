name: Release & Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Unique per (workflow, job) so concurrent jobs never race to write the
          # same setup-uv cache key. The key is otherwise content-based (lockfile
          # hash), so every job across every workflow would otherwise collide.
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev python3-dev build-essential

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright Chromium Browser
        run: uv run playwright install chromium

      - name: Run Unit Tests
        run: uv run pytest tests/ -q --ignore=tests/integration/

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Unique per (workflow, job) so concurrent jobs never race to write the
          # same setup-uv cache key. The key is otherwise content-based (lockfile
          # hash), so every job across every workflow would otherwise collide.
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt-dev python3-dev build-essential

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright Chromium Browser
        run: uv run playwright install chromium

      - name: Run Integration Tests
        run: uv run pytest tests/integration/ -q -m integration

  build:
    name: Build Package
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Unique per (workflow, job) so concurrent jobs never race to write the
          # same setup-uv cache key. The key is otherwise content-based (lockfile
          # hash), so every job across every workflow would otherwise collide.
          cache-suffix: ${{ github.workflow }}-${{ github.job }}

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
