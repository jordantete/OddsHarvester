version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      ## reason: "Temporary compatibility issues. Revisit after migration to Python 3.13."
      - dependency-name: "playwright"
    labels:
      - "pip-dependencies"

  # npm manifests are transient Playwright artifacts, not dependencies of this Python project.
  # This only suppresses update PRs. Alerts come from the dependency graph and must be dismissed by hand.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
